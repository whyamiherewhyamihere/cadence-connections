      .node-service { fill: #f4f5f7; stroke: #2f343b; stroke-width: 2; stroke-dasharray: 8 6; rx: 10; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111418; text-anchor: middle; dominant-baseline: middle; }
      .text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #15191f; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #3e454d; text-anchor: middle; dominant-baseline: middle; }
      .caption { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #4b535c; text-anchor: middle; }
      .line { fill: none; stroke: #2f343b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
