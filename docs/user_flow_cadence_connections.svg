  <path class="line" d="M900 1304 L900 1352"/>
  <text class="hint" x="1036" y="1330">результат</text>
  <rect class="node-final" x="705" y="1352" width="390" height="72"/>
  <text class="text" x="900" y="1379">Заказ успешно оформлен</text>
  <text class="small" x="900" y="1401">сообщение пользователю</text>
