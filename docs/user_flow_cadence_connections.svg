<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343b"/>
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .node { fill: #ffffff; stroke: #2f343b; stroke-width: 2; rx: 10; }
      .node-soft { fill: #fbfcfd; stroke: #2f343b; stroke-width: 2; rx: 10; }
      .node-final { fill: #f4f5f7; stroke: #2f343b; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #2f343b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #111418; text-anchor: middle; }
      .text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #15191f; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #3e454d; text-anchor: middle; dominant-baseline: middle; }
      .hint { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #6c737c; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1600"/>
  <text class="title" x="900" y="58">User Flow пользователя Cadence Connections</text>

  <rect class="node" x="760" y="110" width="280" height="62"/>
